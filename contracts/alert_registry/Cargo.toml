[package]
name = "alert-registry"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# `rlib` so other contracts (e.g. risk_monitor) can import the typed client and
# register this contract in their cross-contract integration tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
